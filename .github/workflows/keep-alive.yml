name: Wake up Streamlit App

on:
  schedule:
    # Roda a cada 15 minutos (a notação cron usa UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send GET request to app
        run: |
          curl -I https://gerador-ficha-cat-squcwzoovpd4zappevev8jt.streamlit.app/
